<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#282660">
    <title>CepteUydu</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/dil.js"></script>
    <script src="js/ortak.js"></script>
    <script src="js/uydu-hesap.js"></script>
    <script src="js/sensor.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="levelPage()">
    <cu-header title-key="nav.level" back></cu-header>

    <main class="page max-w-xl space-y-4">
        <div class="flex bg-white p-1 rounded-xl shadow-card text-sm">
            <button type="button" @click="mode = 'level'" class="flex-1 py-2 rounded-lg" :class="mode === 'level' ? 'bg-navy-800 text-white font-bold' : 'text-ink-500'" x-text="t('level.modeLevel')"></button>
            <button type="button" @click="mode = 'incline'" class="flex-1 py-2 rounded-lg" :class="mode === 'incline' ? 'bg-navy-800 text-white font-bold' : 'text-ink-500'" x-text="t('level.modeIncline')"></button>
        </div>

        <!-- Su terazisi: telefon düz -->
        <section x-show="mode === 'level'" class="card p-5 flex flex-col items-center">
            <div class="relative w-full max-w-[18rem] aspect-square rounded-full border-[6px] transition-colors"
                 :class="isLevel ? 'border-emerald-500 bg-emerald-50' : 'border-amber-400 bg-amber-50'">
                <div class="absolute inset-[30%] rounded-full border-2 border-dashed border-ink-400/50"></div>
                <div class="absolute left-1/2 top-0 bottom-0 w-px bg-ink-400/30"></div>
                <div class="absolute top-1/2 left-0 right-0 h-px bg-ink-400/30"></div>
                <div class="absolute w-14 h-14 -ml-7 -mt-7 rounded-full shadow-lg transition-[left,top] duration-75"
                     :class="isLevel ? 'bg-emerald-500' : 'bg-amber-400'"
                     :style="'left:' + bubble.x + '%; top:' + bubble.y + '%'"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 w-full mt-5 text-center">
                <div class="stat"><div class="stat-label" x-text="t('level.tiltX')"></div><div class="stat-value" x-text="fmt(Math.abs(gx)) + '°'"></div></div>
                <div class="stat"><div class="stat-label" x-text="t('level.tiltY')"></div><div class="stat-value" x-text="fmt(Math.abs(by)) + '°'"></div></div>
            </div>
            <div class="flex gap-2 mt-4">
                <button type="button" @click="calibrate()" class="btn-soft text-sm"><i class="fa-solid fa-bullseye"></i><span x-text="t('level.calibrate')"></span></button>
                <button type="button" @click="resetCal()" class="btn-soft text-sm" x-show="calibrated"><i class="fa-solid fa-rotate-left"></i><span x-text="t('level.reset')"></span></button>
            </div>
            <p class="text-xs text-ink-400 mt-3 text-center" x-text="t('level.levelHelp')"></p>
        </section>

        <!-- Açı ölçer: telefonun uzun kenarı ölçülecek parçaya yaslanır -->
        <section x-show="mode === 'incline'" class="card p-5 flex flex-col items-center">
            <svg viewBox="-110 -110 220 120" class="w-full max-w-[20rem]">
                <path d="M-100 0 A100 100 0 0 1 100 0" fill="none" stroke="#e9e6ff" stroke-width="14"/>
                <line x-show="targetEl !== null" x1="0" y1="0" :x2="-100 * Math.cos((targetEl || 0) * Math.PI / 180)" :y2="-100 * Math.sin((targetEl || 0) * Math.PI / 180)" stroke="#7bd389" stroke-width="3" stroke-dasharray="5 4"/>
                <line x1="0" y1="0" :x2="-95 * Math.cos(angle * Math.PI / 180)" :y2="-95 * Math.sin(angle * Math.PI / 180)" stroke="#282660" stroke-width="6" stroke-linecap="round"/>
                <circle r="7" fill="#f4b740"/>
                <text x="-104" y="14" font-size="9" fill="#8d8ca6">0°</text>
                <text x="0" y="-104" text-anchor="middle" font-size="9" fill="#8d8ca6">90°</text>
            </svg>
            <div class="text-5xl font-bold text-navy-800 tabular-nums mt-2" x-text="fmt(angle) + '°'"></div>
            <div class="text-sm mt-1" x-show="targetEl !== null" :class="Math.abs(angle - targetEl) < 1 ? 'text-emerald-600 font-bold' : 'text-ink-500'"
                 x-text="t('level.targetEl', { v: fmt(targetEl) }) + (Math.abs(angle - targetEl) < 1 ? ' ✓' : '')"></div>
            <p class="text-xs text-ink-400 mt-4 text-center" x-text="t('level.inclineHelp')"></p>
        </section>

        <p x-show="message" class="text-sm text-rose-600 text-center" x-text="message"></p>
        <div class="text-center" x-show="needsStart">
            <button type="button" @click="start()" class="btn-primary"><i class="fa-solid fa-play"></i><span x-text="t('compass.start')"></span></button>
        </div>
    </main>

    <script>
        function levelPage() {
            const s = CepteDurum.get();
            let stop = null;
            return {
                mode: 'level',
                beta: 0, gamma: 0,
                cal: { ...s.level },
                message: '',
                needsStart: typeof (window.DeviceOrientationEvent || {}).requestPermission === 'function',
                gotData: false,

                init() {
                    if (!this.needsStart) this.start();
                    window.addEventListener('pagehide', () => stop && stop());
                },

                async start() {
                    if (!(await CepteSensor.requestPermission())) { this.message = t('ar.noPermission'); return; }
                    this.needsStart = false;
                    stop = CepteSensor.start(d => { this.beta = d.beta; this.gamma = d.gamma; this.gotData = true; });
                    setTimeout(() => { if (!this.gotData) this.message = t('level.noSensor'); }, 2500);
                },

                get calibrated() { return this.cal.beta !== 0 || this.cal.gamma !== 0; },
                get by() { return this.beta - this.cal.beta; },
                get gx() { return this.gamma - this.cal.gamma; },
                get isLevel() { return Math.abs(this.by) < 0.5 && Math.abs(this.gx) < 0.5; },

                // Kabarcık yükseğe kaçar: sağ kenar aşağı (gamma > 0) -> sola; üst kenar yukarı (beta > 0) -> yukarı
                get bubble() {
                    const clamp = v => Math.max(-20, Math.min(20, v));
                    return { x: 50 - clamp(this.gx) / 20 * 40, y: 50 - clamp(this.by) / 20 * 40 };
                },

                // Telefonun uzun ekseninin yatayla açısı (0-90°)
                get angle() { return Math.min(90, Math.abs(this.beta)); },

                get targetEl() {
                    if (!CepteDurum.hasLocation()) return null;
                    const st = CepteDurum.get();
                    const r = UyduHesap.lookAngles(st.lat, st.lon, st.satLon);
                    return r.visible ? r.elevation : null;
                },

                calibrate() {
                    this.cal = { beta: this.beta, gamma: this.gamma };
                    CepteDurum.set({ level: this.cal });
                },

                resetCal() {
                    this.cal = { beta: 0, gamma: 0 };
                    CepteDurum.set({ level: this.cal });
                },
            };
        }
    </script>
</body>
</html>
