name: Android derleme

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'store/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Dil dosyası kontrolü
        run: node scripts/dil-kontrol.mjs

      - name: Web uygulamasını derle (vendor + CSS + www)
        run: npm run build

      - name: Capacitor eşitle
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: İmza anahtarını hazırla
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "CEPTEUYDU_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: APK ve AAB derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CEPTEUYDU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CEPTEUYDU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CEPTEUYDU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Test APK'sı (telefona doğrudan kurulur)
        uses: actions/upload-artifact@v4
        with:
          name: cepteuydu-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Play Store paketi (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: cepteuydu-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
