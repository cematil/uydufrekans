<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Çanak anten azimut, elevasyon ve LNB skew hesaplayıcı; AR kamera ile uydu bulucu ve sesli hizalama. Dish alignment calculator and AR satellite finder.">
    <meta name="theme-color" content="#282660">
    <title>CepteUydu</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/dil.js"></script>
    <script src="js/ortak.js"></script>
    <script src="js/uydu-hesap.js"></script>
    <script src="js/veri.js"></script>
    <script src="js/ar-yon.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="finderPage()" @keydown.escape.window="closeAr()">
    <cu-header title-key="nav.finder" back></cu-header>

    <main class="page">
        <div class="grid grid-cols-1 lg:grid-cols-[22rem_minmax(0,1fr)] gap-4 items-start">

            <!-- Sol: uydu + konum -->
            <div class="space-y-4">
                <section class="card p-4 sm:p-5">
                    <h2 class="section-title"><span class="text-lav-500 mr-1">1</span><span x-text="t('find.satellite')"></span></h2>
                    <select x-model.number="satLon" class="field" :aria-label="t('find.satellite')">
                        <template x-for="p in positions" :key="p.lon">
                            <option :value="p.lon" :selected="p.lon === satLon" x-text="p.label"></option>
                        </template>
                    </select>
                    <details class="mt-3 text-sm">
                        <summary class="cursor-pointer text-ink-500" x-text="t('find.customLon')"></summary>
                        <div class="mt-2 flex gap-2">
                            <input type="number" step="0.1" min="-180" max="180" x-model.number="customLon" :placeholder="t('find.customLonPh')" class="field flex-1">
                            <button type="button" @click="applyCustomLon()" class="btn-soft" x-text="t('common.apply')"></button>
                        </div>
                        <p class="text-xs text-ink-400 mt-1" x-text="t('find.customLonHint')"></p>
                    </details>
                </section>

                <section class="card p-4 sm:p-5">
                    <h2 class="section-title"><span class="text-lav-500 mr-1">2</span><span x-text="t('find.location')"></span></h2>
                    <button type="button" @click="locate()" :disabled="gpsBusy" class="btn-primary w-full mb-2">
                        <i class="fa-solid" :class="gpsBusy ? 'fa-spinner fa-spin' : 'fa-location-crosshairs'"></i>
                        <span x-text="gpsBusy ? t('loc.locating') : t('loc.useGps')"></span>
                    </button>
                    <p x-show="gpsError" class="text-xs text-rose-600 mb-2" x-text="gpsError"></p>
                    <select @change="pickCity($event.target.value); $event.target.value = ''" class="field mb-2" :aria-label="t('loc.pickCity')">
                        <option value="" x-text="t('loc.pickCity')"></option>
                        <template x-for="(c, i) in cities" :key="c.name">
                            <option :value="i" x-text="c.name"></option>
                        </template>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="text-xs text-ink-500"><span x-text="t('common.lat')"></span>
                            <input type="number" step="0.0001" min="-90" max="90" x-model.number="lat" @change="manualLocation()" class="field mt-1">
                        </label>
                        <label class="text-xs text-ink-500"><span x-text="t('common.lon')"></span>
                            <input type="number" step="0.0001" min="-180" max="180" x-model.number="lon" @change="manualLocation()" class="field mt-1">
                        </label>
                    </div>
                    <p class="text-xs text-ink-400 mt-2" x-show="locNote" x-text="locNote"></p>
                    <a href="harita.html" class="text-xs text-lav-600 font-semibold mt-2 inline-block"><i class="fa-solid fa-map-location-dot mr-1"></i><span x-text="t('find.pickOnMap')"></span></a>
                </section>
            </div>

            <!-- Sağ: sonuçlar -->
            <div class="space-y-4">
                <section x-show="result" x-cloak class="card p-4 sm:p-5">
                    <h2 class="section-title"><span class="text-lav-500 mr-1">3</span><span x-text="t('find.angles')"></span>
                        <span class="normal-case font-normal tracking-normal" x-text="currentPosition ? '— ' + currentPosition.label : ''"></span>
                    </h2>

                    <div x-show="result && !result.visible" class="mb-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i><span x-text="t('find.notVisible')"></span>
                    </div>
                    <div x-show="result && result.visible && result.elevation < 10" class="mb-3 p-3 rounded-xl bg-amber-50 text-amber-800 text-sm">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i><span x-text="t('find.lowEl')"></span>
                    </div>

                    <div class="grid grid-cols-2 xl:grid-cols-4 gap-3">
                        <div class="stat">
                            <div class="stat-label"><i class="fa-solid fa-compass mr-1"></i><span x-text="t('find.azCompass')"></span></div>
                            <div class="stat-value" x-text="fmt(magneticAz) + '°'"></div>
                            <div class="text-[11px] text-ink-400" x-text="compassName(result?.azimuth || 0) + ' · ' + t('find.trueNorth', { v: fmt(result?.azimuth) })"></div>
                        </div>
                        <div class="stat">
                            <div class="stat-label"><i class="fa-solid fa-arrow-up-right-dots mr-1"></i><span x-text="t('common.elevation')"></span></div>
                            <div class="stat-value" x-text="fmt(result?.elevation) + '°'"></div>
                            <div class="text-[11px] text-ink-400" x-text="t('find.aboveHorizon')"></div>
                        </div>
                        <div class="stat">
                            <div class="stat-label"><i class="fa-solid fa-rotate mr-1"></i><span x-text="t('common.lnbSkew')"></span></div>
                            <div class="stat-value" x-text="fmtSigned(result?.skew) + '°'"></div>
                            <div class="text-[11px] text-ink-400" x-text="skewText"></div>
                        </div>
                        <div class="stat">
                            <div class="stat-label"><i class="fa-solid fa-ruler mr-1"></i><span x-text="t('find.distance')"></span></div>
                            <div class="stat-value" x-text="fmtInt(Math.round(result?.distanceKm || 0))"></div>
                            <div class="text-[11px] text-ink-400">km</div>
                        </div>
                    </div>

                    <div class="mt-5 grid md:grid-cols-2 gap-5 items-center">
                        <div class="flex items-center gap-4">
                            <!-- Ekrana bakan kişi = çanağın arkasından uyduya bakan kişi -->
                            <svg viewBox="-60 -60 120 120" class="w-32 h-32 shrink-0" role="img" :aria-label="t('common.lnbSkew') + ' ' + fmt(result?.skew) + '°'">
                                <circle r="56" fill="#f4f2ff" stroke="#d8d3fb" stroke-width="2"/>
                                <line x1="-50" y1="0" x2="50" y2="0" stroke="#a99ff5" stroke-width="1.5" stroke-dasharray="4 4"/>
                                <g :transform="'rotate(' + (result?.skew || 0) + ')'">
                                    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#ffffff" stroke="#282660" stroke-width="2.5"/>
                                    <circle r="11" fill="#e9e6ff" stroke="#282660" stroke-width="2"/>
                                    <line x1="-46" y1="0" x2="46" y2="0" stroke="#7c6cf2" stroke-width="3" stroke-linecap="round"/>
                                    <polygon points="46,-5 56,0 46,5" fill="#7c6cf2"/>
                                </g>
                            </svg>
                            <p class="text-sm text-ink-500" x-text="t('find.lnbHelp')"></p>
                        </div>
                        <div class="text-sm space-y-2">
                            <label class="block">
                                <span class="text-xs text-ink-500" x-text="t('find.declination')"></span>
                                <b class="text-navy-800" x-text="fmtSigned(declination) + '°'"></b>
                                <input type="range" min="-20" max="20" step="0.5" x-model.number="declination" @change="save()" class="w-full">
                            </label>
                            <p class="text-xs text-ink-400" x-text="t('find.declinationHelp')"></p>
                            <p class="text-xs text-ink-400"><i class="fa-solid fa-circle-info mr-1"></i><span x-text="t('find.offsetNote')"></span></p>
                        </div>
                    </div>
                </section>

                <!-- Seçili uydunun şebeke / ayar frekansları: çanak ayarlanırken alıcıda bu TP açılıp sinyal en yükseğe getirilir -->
                <section x-show="result && currentNet.length" x-cloak class="card p-4 sm:p-5">
                    <h2 class="section-title"><i class="fa-solid fa-tower-broadcast mr-1 text-lav-500"></i><span x-text="t('net.forSat')"></span></h2>
                    <div class="grid sm:grid-cols-2 gap-2">
                        <template x-for="(tp, i) in currentNet" :key="i">
                            <button type="button" @click="copyTp(tp, i)" class="flex items-center gap-3 rounded-xl px-3 py-2 text-left border"
                                    :class="tp.tur === 'sebeke' ? 'bg-emerald-50 border-emerald-200' : tp.tur === 'ana' ? 'bg-sky-50 border-sky-200' : 'bg-lav-50 border-lav-100'">
                                <span class="font-mono font-bold text-navy-800 whitespace-nowrap" x-text="CepteSebeke.text(tp)"></span>
                                <span class="flex-1 min-w-0 text-[11px] leading-tight text-ink-500" x-text="CepteSebeke.note(tp)"></span>
                                <i class="text-xs" :class="copiedTp === i ? 'fa-solid fa-check text-emerald-600' : 'fa-regular fa-copy text-ink-400'"></i>
                            </button>
                        </template>
                    </div>
                    <p class="text-xs text-ink-400 mt-2" x-text="t('net.alignTip')"></p>
                    <a href="sebeke.html" class="text-xs text-lav-600 font-semibold mt-1 inline-block" x-text="t('net.allLink')"></a>
                </section>

                <section x-show="result" x-cloak x-ref="arCard" class="card p-4 sm:p-5" :class="arHint && 'ring-4 ring-lav-400'">
                    <button type="button" @click="openAr()" :disabled="!result?.visible" class="btn-accent w-full py-4 text-lg">
                        <i class="fa-solid fa-camera"></i><span x-text="t('find.openAr')"></span>
                    </button>
                    <p class="text-xs text-ink-400 mt-2 text-center" x-text="t('find.arHelp')"></p>
                </section>

                <section x-show="!result" class="card text-center text-ink-500 py-10 px-4">
                    <i class="fa-solid fa-location-dot text-3xl mb-3 text-ink-400"></i>
                    <p x-text="t('find.needLocation')"></p>
                </section>
            </div>
        </div>
    </main>

    <!-- ============ AR GÖRÜNÜMÜ ============ -->
    <div x-show="arOpen" x-cloak class="ar-root" x-ref="arRoot">
        <video x-ref="video" playsinline muted autoplay></video>
        <canvas x-ref="canvas"></canvas>

        <div class="ar-hud flex justify-between items-start gap-3 bg-gradient-to-b from-black/70 to-transparent">
            <div class="text-xs font-mono leading-5">
                <div class="text-sm font-sans font-bold" x-text="currentPosition?.label"></div>
                <div><span class="text-white/60" x-text="t('ar.target')"></span> Az <b class="text-lav-200" x-text="fmt(result?.azimuth) + '°'"></b> · El <b class="text-lav-200" x-text="fmt(result?.elevation) + '°'"></b></div>
                <div><span class="text-white/60" x-text="t('ar.phone')"></span> Az <b x-text="hud.heading === null ? '—' : fmt(hud.heading) + '°'"></b> · El <b x-text="hud.pitch === null ? '—' : fmt(hud.pitch) + '°'"></b></div>
            </div>
            <button type="button" @click="closeAr()" :aria-label="t('common.close')" class="w-11 h-11 shrink-0 rounded-full bg-black/60 border border-white/20 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="absolute left-0 right-0 top-1/3 text-center px-6 pointer-events-none" x-show="hud.message">
            <div class="inline-block bg-black/70 border border-white/10 rounded-2xl px-4 py-3 text-sm" x-text="hud.message"></div>
        </div>

        <div class="ar-bottom bg-gradient-to-t from-black/80 to-transparent">
            <div class="text-center mb-3">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-base font-bold"
                     :class="hud.locked ? 'bg-emerald-500 text-navy-950' : 'bg-black/60 border border-white/20'">
                    <i class="fa-solid" :class="hud.locked ? 'fa-circle-check' : 'fa-location-arrow'"></i>
                    <span x-text="hud.guidance"></span>
                </div>
                <div class="text-[11px] text-white/70 mt-1" x-show="hud.error !== null" x-text="t('ar.deviation', { v: fmt(hud.error) })"></div>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <button type="button" @click="toggleBeep()" class="px-3 py-2 rounded-xl border" :class="beepOn ? 'bg-lav-500 border-lav-500 font-bold' : 'bg-black/60 border-white/20'">
                    <i class="fa-solid" :class="beepOn ? 'fa-volume-high' : 'fa-volume-xmark'"></i> <span x-text="t('ar.beep')"></span>
                </button>
                <button type="button" @click="showTune = !showTune" class="px-3 py-2 rounded-xl bg-black/60 border border-white/20">
                    <i class="fa-solid fa-sliders"></i> <span x-text="t('ar.calibration')"></span>
                </button>
                <span class="text-white/60 ml-auto text-right leading-4 text-[11px]" x-text="t('ar.beltLegend')"></span>
            </div>
            <div x-show="showTune" class="mt-3 bg-black/70 border border-white/10 rounded-2xl p-3 space-y-2 text-xs">
                <label class="block"><span x-text="t('ar.trim')"></span>: <b x-text="fmtSigned(trim) + '°'"></b>
                    <input type="range" min="-30" max="30" step="0.5" x-model.number="trim" @change="save(); rebuildScene()" class="w-full">
                </label>
                <label class="block"><span x-text="t('ar.fov')"></span>: <b x-text="fov + '°'"></b>
                    <input type="range" min="40" max="100" step="1" x-model.number="fov" @change="save()" class="w-full">
                </label>
                <p class="text-white/60" x-text="t('ar.tuneHelp')"></p>
            </div>
        </div>
    </div>

    <script>
        CepteVeri.registerServiceWorker();

        function finderPage() {
            const s = CepteDurum.get();
            const lonParam = parseFloat(new URLSearchParams(location.search).get('konum'));

            return {
                positions: CepteVeri.FALLBACK_POSITIONS.slice(),
                cities: CepteKonum.CITIES,
                satLon: Number.isFinite(lonParam) ? lonParam : s.satLon,
                customLon: null,
                lat: s.lat,
                lon: s.lon,
                loc: s.loc,
                declination: s.declination ?? (CepteDurum.hasLocation() ? CepteKonum.guessDeclination(s.lat, s.lon) : 0),
                gpsBusy: false,
                gpsError: '',
                networks: [],
                copiedTp: null,
                arHint: location.hash === '#ar',

                arOpen: false,
                beepOn: s.beepOn,
                trim: s.trim,
                fov: s.fov,
                showTune: false,
                hud: { heading: null, pitch: null, error: null, guidance: '', locked: false, message: '' },

                async init() {
                    this.ensurePosition(this.satLon);
                    this.save();
                    this.positions = await CepteVeri.loadPositions();
                    this.ensurePosition(this.satLon);
                    CepteVeri.loadNetworks().then(n => { this.networks = n; });
                    this.$watch('satLon', () => { this.save(); this.rebuildScene(); });
                    this.$watch('declination', () => this.rebuildScene());
                    if (this.arHint) this.$nextTick(() => this.$refs.arCard.scrollIntoView({ behavior: 'smooth', block: 'center' }));
                },

                ensurePosition(lon) {
                    if (!this.positions.some(p => p.lon === lon)) {
                        this.positions.push({ lon, names: [t('find.customName')], label: UyduHesap.formatOrbitalPosition(lon) + ' — ' + t('find.customName') });
                        this.positions.sort((a, b) => b.lon - a.lon);
                    }
                },

                applyCustomLon() {
                    const v = Number(this.customLon);
                    if (!Number.isFinite(v) || v < -180 || v > 180) return;
                    const lon = Math.round(v * 10) / 10;
                    this.ensurePosition(lon);
                    this.satLon = lon;
                },

                get currentNet() {
                    const n = this.networks.find(x => x.lon === this.satLon);
                    return n ? n.official.concat(n.suggested) : [];
                },

                async copyTp(tp, i) {
                    try {
                        await navigator.clipboard.writeText(CepteSebeke.text(tp));
                        this.copiedTp = i;
                        setTimeout(() => { if (this.copiedTp === i) this.copiedTp = null; }, 1500);
                    } catch (e) { /* yok say */ }
                },

                get currentPosition() { return this.positions.find(p => p.lon === this.satLon) || null; },

                get hasLocation() {
                    return Number.isFinite(this.lat) && Number.isFinite(this.lon) && Math.abs(this.lat) <= 90 && Math.abs(this.lon) <= 180;
                },

                get result() {
                    if (!this.hasLocation || !Number.isFinite(this.satLon)) return null;
                    return UyduHesap.lookAngles(this.lat, this.lon, this.satLon);
                },

                get magneticAz() {
                    return this.result ? UyduHesap.normalizeAngle360(this.result.azimuth - this.declination) : 0;
                },

                get skewText() {
                    const v = this.result?.skew || 0;
                    if (Math.abs(v) < 0.5) return t('find.skewZero');
                    return t(v > 0 ? 'find.skewCw' : 'find.skewCcw');
                },

                get locNote() { this.$store.app.lang; return CepteKonum.locationLabel({ loc: this.loc }); },

                async locate() {
                    this.gpsBusy = true;
                    this.gpsError = '';
                    try {
                        const p = await CepteKonum.locate();
                        this.setLocation(p.lat, p.lon, { type: 'gps', acc: p.accuracy });
                    } catch (e) {
                        this.gpsError = CepteKonum.locateErrorText(e);
                    } finally {
                        this.gpsBusy = false;
                    }
                },

                pickCity(index) {
                    const c = this.cities[index];
                    if (c) this.setLocation(c.lat, c.lon, { type: 'city', name: c.name });
                },

                manualLocation() {
                    if (this.hasLocation) this.setLocation(this.lat, this.lon, { type: 'manual' });
                },

                setLocation(lat, lon, loc) {
                    this.lat = lat;
                    this.lon = lon;
                    this.loc = loc;
                    CepteKonum.saveLocation(lat, lon, loc);
                    this.declination = CepteDurum.get().declination;
                    this.rebuildScene();
                },

                save() {
                    CepteDurum.set({ satLon: this.satLon, declination: this.declination, beepOn: this.beepOn, trim: this.trim, fov: this.fov });
                },

                // ---------------- AR ----------------
                async openAr() {
                    if (!this.result?.visible) return;
                    this.arOpen = true;
                    this.hud.message = '';
                    await this.$nextTick();
                    ArYon.start({
                        root: this.$refs.arRoot,
                        video: this.$refs.video,
                        canvas: this.$refs.canvas,
                        getScene: () => this.scene(),
                        getSettings: () => ({ fov: this.fov, beepOn: this.beepOn }),
                        onHud: hud => Object.assign(this.hud, hud),
                    });
                },

                closeAr() {
                    if (!this.arOpen) return;
                    this.arOpen = false;
                    ArYon.stop();
                },

                toggleBeep() {
                    this.beepOn = !this.beepOn;
                    this.save();
                },

                rebuildScene() {
                    if (this.arOpen) ArYon.invalidate();
                },

                // AR sahnesi: hedef uydu, diğer uydular ve Clarke kuşağı (gerçek kuzeye göre)
                scene() {
                    const r = this.result;
                    if (!r) return null;
                    const belt = [];
                    for (let d = -85; d <= 85; d += 1) {
                        const a = UyduHesap.lookAngles(this.lat, this.lon, this.lon + d);
                        if (a.elevation > -3) belt.push({ az: a.azimuth, el: a.elevation });
                    }
                    const others = this.positions
                        .filter(p => p.lon !== this.satLon)
                        .map(p => ({ label: UyduHesap.formatOrbitalPosition(p.lon), ...UyduHesap.lookAngles(this.lat, this.lon, p.lon) }))
                        .filter(a => a.elevation > 0)
                        .map(a => ({ label: a.label, az: a.azimuth, el: a.elevation }));
                    return {
                        target: { az: r.azimuth, el: r.elevation, label: this.currentPosition?.names[0] || UyduHesap.formatOrbitalPosition(this.satLon) },
                        belt,
                        others,
                        // Sensörler manyetik kuzeye göre ölçer; gerçek kuzeye çevirmek için eklenecek düzeltme
                        headingCorrection: this.declination + this.trim,
                    };
                },
            };
        }
    </script>
</body>
</html>
