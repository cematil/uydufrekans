<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="CepteUydu: uydu bulucu, çanak anten hizalama, AR kamera, pusula, su terazisi ve uydu frekans rehberi. Satellite finder, dish alignment and frequency guide.">
    <meta name="theme-color" content="#282660">
    <title>CepteUydu</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/dil.js"></script>
    <script src="js/ortak.js"></script>
    <script src="js/uydu-hesap.js"></script>
    <script src="js/veri.js"></script>
    <script src="js/ikonlar.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="homePage()">

    <!-- ============ AÇILIŞ EKRANI (ilk açılış) ============ -->
    <div x-show="!onboarded" x-cloak class="fixed inset-0 z-[70] bg-gradient-to-b from-navy-900 to-navy-950 text-white flex flex-col items-center justify-between px-6 overflow-hidden"
         style="padding-top: max(1.5rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom))">
        <div class="w-full flex justify-end gap-2 text-xs">
            <button type="button" class="px-3 py-1.5 rounded-full border border-white/30" :class="$store.app.lang === 'tr' && 'bg-white text-navy-900 font-bold'" @click="$store.app.setLang('tr')">TR</button>
            <button type="button" class="px-3 py-1.5 rounded-full border border-white/30" :class="$store.app.lang === 'en' && 'bg-white text-navy-900 font-bold'" @click="$store.app.setLang('en')">EN</button>
        </div>

        <svg viewBox="0 0 320 320" class="w-[min(85vw,24rem)] h-auto" aria-hidden="true">
            <defs>
                <radialGradient id="shade" cx="38%" cy="35%" r="70%">
                    <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#0b1e4f" stop-opacity=".45"/>
                </radialGradient>
            </defs>
            <g fill="#ffffff" opacity=".35">
                <circle cx="30" cy="40" r="1.5"/><circle cx="290" cy="30" r="1.2"/><circle cx="270" cy="290" r="1.6"/>
                <circle cx="40" cy="280" r="1.2"/><circle cx="160" cy="18" r="1"/><circle cx="305" cy="170" r="1.3"/>
                <circle cx="12" cy="170" r="1"/><circle cx="210" cy="300" r="1"/>
            </g>
            <g class="orbit orbit-a">
                <ellipse cx="160" cy="160" rx="150" ry="58" fill="none" stroke="#a99ff5" stroke-opacity=".5" stroke-dasharray="4 6"/>
                <g transform="translate(298 140) rotate(30)">
                    <rect x="-5" y="-4" width="10" height="8" rx="2" fill="#f4b740"/>
                    <rect x="-16" y="-2.5" width="10" height="5" fill="#5bc0eb"/><rect x="6" y="-2.5" width="10" height="5" fill="#5bc0eb"/>
                </g>
            </g>
            <g class="orbit orbit-b">
                <ellipse cx="160" cy="160" rx="150" ry="58" fill="none" stroke="#a99ff5" stroke-opacity=".5" stroke-dasharray="4 6" transform="rotate(60 160 160)"/>
                <g transform="translate(95 40) rotate(-20)">
                    <rect x="-5" y="-4" width="10" height="8" rx="2" fill="#7bd389"/>
                    <rect x="-16" y="-2.5" width="10" height="5" fill="#5bc0eb"/><rect x="6" y="-2.5" width="10" height="5" fill="#5bc0eb"/>
                </g>
            </g>
            <g class="orbit orbit-c">
                <ellipse cx="160" cy="160" rx="150" ry="58" fill="none" stroke="#a99ff5" stroke-opacity=".5" stroke-dasharray="4 6" transform="rotate(120 160 160)"/>
                <g transform="translate(100 285)">
                    <circle r="5" fill="#f6a13a"/><path d="M-9 -9a13 13 0 0 1 18 0" stroke="#f6a13a" stroke-width="1.5" fill="none"/>
                </g>
            </g>
            <circle cx="160" cy="160" r="76" fill="#3fa9e0"/>
            <path d="M110 120c14-10 30-4 38 4s22 2 26 14-8 22-20 22-14 14-28 12-22-16-20-28 0-18 4-24z" fill="#1d6fa8"/>
            <path d="M176 196c10-8 26-6 30 4s-6 18-16 18-20-12-14-22z" fill="#1d6fa8"/>
            <path d="M188 112c8-4 20 0 22 8s-8 10-14 8-12-12-8-16z" fill="#1d6fa8"/>
            <path d="M126 104c6-8 22-8 24-2s-8 8-14 8-12 0-10-6z" fill="#ffffff" opacity=".9"/>
            <circle cx="160" cy="160" r="76" fill="url(#shade)"/>
        </svg>

        <div class="text-center">
            <h1 class="text-3xl sm:text-4xl font-bold mb-2">CepteUydu</h1>
            <p class="text-white/70 max-w-xs mx-auto text-sm sm:text-base" x-text="t('splash.subtitle')"></p>
        </div>

        <button type="button" class="px-10 py-3.5 rounded-full bg-lav-200 text-navy-900 font-semibold text-lg shadow-lg active:scale-95 transition-transform" @click="finishOnboarding()" x-text="t('splash.start')"></button>
    </div>

    <!-- ============ ANA EKRAN ============ -->
    <cu-header title-key="app.name"></cu-header>

    <main class="page space-y-4">

        <!-- Hızlı bakış: kayıtlı konum + seçili uydu -->
        <a href="hizala.html" class="card-link items-center gap-4 p-4 !bg-gradient-to-r from-navy-800 to-navy-600 text-white">
            <div class="w-12 h-12 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-crosshairs text-xl"></i>
            </div>
            <template x-if="quick">
                <div class="flex-1 min-w-0">
                    <div class="text-xs text-white/70 truncate" x-text="quick.title"></div>
                    <div class="font-semibold text-sm sm:text-base">
                        <span x-text="t('common.az') + ' ' + fmt(quick.az) + '°'"></span> ·
                        <span x-text="t('common.el') + ' ' + fmt(quick.el) + '°'"></span> ·
                        <span x-text="t('common.skew') + ' ' + fmtSigned(quick.skew) + '°'"></span>
                    </div>
                </div>
            </template>
            <template x-if="!quick">
                <div class="flex-1">
                    <div class="font-semibold" x-text="t('home.quickEmptyTitle')"></div>
                    <div class="text-xs text-white/70" x-text="t('home.quickEmptyText')"></div>
                </div>
            </template>
            <i class="fa-solid fa-chevron-right text-white/60"></i>
        </a>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
            <template x-for="item in items" :key="item.href">
                <a :href="item.href" class="card-link p-4 sm:p-5"
                   :class="item.wide ? item.wide + ' items-center justify-between gap-4' : 'flex-col items-center justify-center text-center gap-3 min-h-[9.5rem]'">
                    <div :class="item.wide ? 'min-w-0' : 'order-2'">
                        <div class="font-semibold text-ink-900 text-[15px] sm:text-base" x-text="t(item.title)"></div>
                        <div x-show="item.wide" class="text-xs text-ink-500 mt-0.5" x-text="item.desc ? t(item.desc) : ''"></div>
                    </div>
                    <div class="icon-ring" :class="item.wide ? '' : 'order-1'" :style="'--ring:' + item.ring" x-html="CepteIkon(item.icon)"></div>
                </a>
            </template>
        </div>

        <!-- TKGS -->
        <a href="sebeke.html" class="card-link p-4 items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-thumbtack"></i></div>
            <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm" x-text="t('tkgs.title')"></div>
                <div class="text-xs text-ink-500" x-text="t('tkgs.short')"></div>
            </div>
            <span class="font-mono text-sm font-bold text-navy-800 bg-lav-100 rounded-lg px-2.5 py-1.5 shrink-0">12380 V 27500</span>
        </a>

        <p class="text-center text-[11px] text-ink-400 pt-2" x-show="dataInfo" x-text="dataInfo"></p>
    </main>

    <script>
        CepteVeri.registerServiceWorker();

        function homePage() {
            return {
                onboarded: !!CepteDurum.get().onboarded,
                info: null,
                items: [
                    { href: 'hizala.html', icon: 'finder', ring: '#2aa7b8', title: 'nav.finder', desc: 'home.finderDesc', wide: 'col-span-2 md:col-span-3 lg:col-span-2' },
                    { href: 'harita.html', icon: 'map', ring: '#5bc0eb', title: 'nav.map' },
                    { href: 'konum.html', icon: 'location', ring: '#1f3c88', title: 'nav.location' },
                    { href: 'pusula.html', icon: 'compass', ring: '#e94b4b', title: 'nav.compass' },
                    { href: 'terazi.html', icon: 'level', ring: '#f4b740', title: 'nav.level' },
                    { href: 'hizala.html#ar', icon: 'ar', ring: '#7c6cf2', title: 'nav.ar' },
                    { href: 'kanallar.html', icon: 'channels', ring: '#3a3780', title: 'nav.channels' },
                    { href: 'sebeke.html', icon: 'network', ring: '#2f9e57', title: 'nav.network', desc: 'home.networkDesc', wide: 'col-span-2 md:col-span-1' },
                    { href: 'alan.html', icon: 'area', ring: '#6aa84f', title: 'nav.area', desc: 'home.areaDesc', wide: 'col-span-2 md:col-span-2 lg:col-span-3' },
                ],

                get quick() {
                    if (!CepteDurum.hasLocation()) return null;
                    const st = CepteDurum.get();
                    const r = UyduHesap.lookAngles(st.lat, st.lon, st.satLon);
                    return {
                        title: UyduHesap.formatOrbitalPosition(st.satLon) + ' · ' + (CepteKonum.locationLabel(st) || (fmt(st.lat, 3) + ', ' + fmt(st.lon, 3))),
                        az: r.azimuth, el: r.elevation, skew: r.skew,
                    };
                },

                // "Veri: GitHub · 06.10.2026 · 29.110 kayıt"
                get dataInfo() {
                    if (!this.info) return '';
                    const m = this.info.meta || {};
                    const date = m.surum ? new Date(m.surum).toLocaleDateString(currentLang() === 'tr' ? 'tr-TR' : 'en-GB') : '—';
                    return t('data.info', { source: t('data.src.' + this.info.source), date, n: fmtInt(m.kayit) });
                },

                init() {
                    // Veriyi arka planda GitHub ile eşitle (sayfa çizildikten sonra)
                    setTimeout(async () => {
                        try { this.info = await CepteVeri.loadWithInfo(); } catch (e) { /* veri sayfası hatayı gösterir */ }
                    }, 400);
                },

                finishOnboarding() {
                    CepteDurum.set({ onboarded: true });
                    this.onboarded = true;
                },
            };
        }
    </script>
</body>
</html>
